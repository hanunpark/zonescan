<body>
<header><div class="h1"><div class="tt"><b>타이어케어 출고 관리</b><small>v2.4 · 2026-11-24</small></div><button id="ctr" title="거점 바꾸기"></button><button id="whoB"></button></div>

<script>
{
const GAS='https://script.google.com/macros/s/AKfycby33E3x2WOVkZd_Kh4LSumPMT-KKbNa292E9WNKKTdx40WjCxsVgpSTq2R7oJby6XDF/exec',PICK='pick.html',TRUCK='truck.html';
const TST=[['arrive','용차 도착'],['depart','출고 처리']];
const FL=[['print','지시서'],['wo','출고 운송장'],['wr','회수 운송장']];
let BR=null;/* PC 피킹지시서 도구 안에서 열렸을 때: 루티 연결(운송장 인쇄) 통로 */
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const now=()=>{const d=new Date();return ymd(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())},dow=s=>'일월화수목금토'[new Date(s+'T00:00:00').getDay()];
const kc=(a,b)=>String(a).localeCompare(String(b),'ko');
const at=s=>{s=String(s||'');if(/^\d{4}-\d\d-\d\d/.test(s))return s.slice(5,16).replace('T',' ');const d=new Date(s);return isNaN(d)?s.slice(0,16):pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const dt=v=>v?String(v).replace('T',' ').slice(5,16).replace('-','/'):'-';
const SZ=/(\d{3}\/\d{2}Z?R\d{2})/,size=p=>{const m=String(p||'').match(SZ);return m?m[1]:String(p||'').split('_')[0]};
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem('wh_'+k)||'null');localStorage.setItem('wh_'+k,JSON.stringify(v))}catch(e){return null}};
let KEY=ls('key')||'',WHO=ls('who')||'',TAB=ls('tab')||'list',KIND='trk',TYPE='';
const T0=ymd(new Date()),F={from:T0,to:T0,center:ls('center')||''};
/* 고른 기간은 같은 날 같은 탭 안에서만 유지 (지시서를 열었다 돌아와도 그대로) */
try{const r=JSON.parse(sessionStorage.getItem('wh_range')||'null');if(r&&r.day===T0){F.from=r.from;F.to=r.to}}catch(e){}
function keepRange(){try{sessionStorage.setItem('wh_range',JSON.stringify({day:T0,from:F.from,to:F.to}))}catch(e){}}
let SHOWCX=false,SHOWCXS=false,D={srv:[],trk:[]},LOADED=false,PEND=0,SEQ=0,FOCUS='',WIDE=false;
{const q=new URLSearchParams(location.search),t=q.get('tab');if(t==='list'||t==='out'){TAB=t;if(q.get('trk')){KIND='trk';FOCUS=q.get('trk')}else if(q.get('no')){FOCUS=q.get('no');if(t==='out')KIND='drv'}}else if(q.get('no')){TAB='list';FOCUS=q.get('no')}if(location.search)history.replaceState(null,'',location.pathname+location.hash)}
{const h=location.hash.slice(1);if(h){KEY=decodeURIComponent(h);ls('key',KEY);history.replaceState(null,'',location.pathname+location.search)}}
async function get(q){const j=await (await fetch(GAS+'?'+q+(KEY?'&t='+encodeURIComponent(KEY):''))).json();if(!j.ok)throw new Error(j.err||'오류');return j}
async function post(b,safe){b.t=KEY;for(let n=0;;n++){let j;try{j=await (await fetch(GAS,{method:'POST',body:JSON.stringify(b)})).json()}catch(e){if(safe&&n<1){await new Promise(r=>setTimeout(r,1200));continue}throw new Error('통신 실패 — 저장되지 않았을 수 있습니다.')}if(j.busy&&safe&&n<1){await new Promise(r=>setTimeout(r,1500));continue}if(!j.ok)throw new Error(j.err||'오류');return j}}
function fkey(){return F.from+'|'+F.to}
/* 누른 버튼에 바로 표시 */
let BB=null;function busyBtn(b){if(BB){BB.textContent=BB.dataset.t;BB.disabled=false;BB=null}if(b){BB=b;b.dataset.t=b.textContent;b.textContent='불러오는 중…';b.disabled=true}}
/* 오늘·내일은 미리 받아 두어 누르면 바로 보이게 */
let PF=false;function prefetch(){if(PF)return;PF=true;const t=ymd(new Date());[[t,t],[addD(t,1),addD(t,1)]].forEach(([a,b])=>{const k=a+'|'+b;if(MC[k]||k===fkey())return;const sv=[F.from,F.to];F.from=a;F.to=b;fetchAll().then(n=>{MC[n.k]=n}).catch(()=>{});F.from=sv[0];F.to=sv[1]})}
function fetchAll(){const k=fkey();return Promise.all([get('a=list&from='+addD(F.from,-7)+'&to='+addD(F.to,7)+'&ifrom='+F.from+'&ito='+F.to).then(r=>r.items),get('a=trk_list&from='+addD(F.from,-10)+'&to='+addD(F.to,10)).then(r=>r.items)]).then(([srv,trk])=>({k,srv:srv.filter(x=>x.M),trk}))}
const MC={};
async function load(quiet){const seq=++SEQ,key=fkey();if(!LOADED){const c=MC[key]||(()=>{const s=ls('cache');return s&&s.k===key?s:null})();if(c){D=c;LOADED=true;draw()}}
 if(!LOADED&&$('#m').querySelector('.c,.kind')){$('#m').style.opacity=.45;LOADED=true}
 if(!LOADED)$('#m').innerHTML='<div class="msg">불러오는 중…</div>';else if(!quiet)$('#busy').hidden=false;
 try{const n=await fetchAll();MC[n.k]=n;if(seq!==SEQ||key!==fkey())return;$('#busy').hidden=true;$('#m').style.opacity='';busyBtn();ls('cache',n);prefetch();if(PEND||$('#dlg'))return;const same=LOADED&&JSON.stringify([D.srv,D.trk])===JSON.stringify([n.srv,n.trk]);D=n;LOADED=true;if(!same)draw()}
 catch(e){$('#busy').hidden=true;$('#m').style.opacity='';busyBtn();if(seq!==SEQ)return;if(!LOADED)$('#m').innerHTML='<div class="msg">불러오지 못했습니다.<br><small>'+esc(e.message)+'</small><br><br><button class="b" onclick="location.reload()">다시 시도</button>'+'</div>';if(/키가 맞지/.test(e.message)){KEY='';ls('key','');pinPad(KEY0?'비밀번호가 바뀌었습니다. 새 비밀번호를 눌러 주세요.':'')}}}
const KEY0=KEY;
function pinPad(note){$('#flt').hidden=true;let v='';const dr=()=>{document.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i<v.length))};
 $('#m').innerHTML=`<div class="pin"><h3>비밀번호 4자리</h3><div class="mu">관리자에게 받은 숫자 4자리를 누르세요.<br>한 번 누르면 이 폰에 저장됩니다.</div><div class="dots"><i></i><i></i><i></i><i></i></div><div class="er" id="p_e">${esc(note||'')}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button class="x" data-n="c">지우기</button><button data-n="0">0</button><button class="x" data-n="b">←</button></div></div>`;
 $('.pad').onclick=async e=>{const b=e.target.closest('[data-n]');if(!b||$('.pad').dataset.busy)return;const n=b.dataset.n;if(n==='c')v='';else if(n==='b')v=v.slice(0,-1);else if(v.length<4)v+=n;dr();if(v.length<4)return;
  $('.pad').dataset.busy='1';$('#p_e').style.color='#556';$('#p_e').textContent='확인 중…';
  try{const j=await (await fetch(GAS+'?a=auth&t='+v)).json();if(j.ok){KEY=v;ls('key',v);LOADED=false;load();return}$('#p_e').style.color='';$('#p_e').textContent=j.err||'비밀번호가 맞지 않습니다';}catch(x){$('#p_e').style.color='';$('#p_e').textContent='통신 상태를 확인해 주세요.'}
  v='';dr();delete $('.pad').dataset.busy}}
/* 저장: 화면을 먼저 바꾸고 뒤에서 저장. 실패하면 서버 내용으로 되돌린다. 같은 건은 누른 순서대로 처리 */
let Q=Promise.resolve();
function save(apply,body,safe,done,pre){apply();draw();PEND++;Q=Q.then(async()=>{for(const b of pre||[])await post(b,safe);return post(body,safe)}).then(r=>{PEND--;if(done)done(r);if(!PEND)ls('cache',D)}).catch(e=>{PEND--;alert('저장하지 못했습니다 — 최신 내용으로 되돌립니다.\n'+e.message);LOADED=true;load()})}
function needWho(){if(WHO)return true;askWho();return false}
function askWho(){dlg(`<h3>이름</h3><div class="mu">체크·수정한 사람으로 기록됩니다. 로그인은 없습니다.</div><label>이름</label><input id="d_who" value="${esc(WHO)}" placeholder="예: 홍길동"><div class="er" id="d_e"></div><div class="act" style="justify-content:flex-end"><button class="b" data-x>닫기</button><button class="b p" id="d_ok">저장</button></div>`);
 $('#d_ok').onclick=()=>{const v=$('#d_who').value.trim();if(!v){$('#d_e').textContent='이름을 넣어 주세요.';return}WHO=v;ls('who',v);close();head()}}

function close(){const d=$('#dlg');if(d)d.remove()}
function head(){$('#ctr').innerHTML='<small>작업 거점</small>'+esc(F.center||'전체 거점');$('#ctr').classList.toggle('all',!F.center);$('#whoB').textContent=WHO?'👤 '+WHO:'이름 입력 ✎';$('#whoB').classList.toggle('need',!WHO);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB))}
const isd=r=>{const s=String(r.M.issued||r.at||'');if(/^\d{4}-\d\d-\d\d/.test(s))return s.slice(0,10);const d=new Date(s);return isNaN(d)?'':ymd(d)},inRng=r=>(r.M.date>=F.from&&r.M.date<=F.to)||(isd(r)>=F.from&&isd(r)<=F.to);
