<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>타이어케어 출고 관리</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#eef1f5;color:#10223a;font:15px/1.45 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:#10223a;color:#fff;padding:8px 12px 0}
.h1{display:flex;align-items:center;gap:8px}.h1 b{font-size:17px}.h1 small{opacity:.7;font-size:11px}.h1 button{margin-left:auto;background:transparent;border:1px solid #ffffff66;color:#fff;border-radius:999px;height:30px;padding:0 12px;font-size:13px}
.tabs{display:flex;margin-top:8px}.tabs button{flex:1;height:42px;border:0;background:transparent;color:#b9c4d6;font-weight:800;font-size:15px;border-bottom:3px solid transparent}.tabs button.on{color:#fff;border-bottom-color:#ff7a1a}
#flt{background:#fff;border-bottom:1px solid #d5dbe5;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
#flt select,#flt input{height:36px;border:1px solid #c5ccd6;border-radius:8px;padding:0 6px;background:#fff;font-size:14px;max-width:150px}
.b{height:36px;border:1px solid #c5ccd6;background:#fff;border-radius:8px;padding:0 12px;font-weight:700;font-size:14px}.b.p{background:#ff7a1a;border-color:#ff7a1a;color:#fff}.b.s{height:32px;font-size:13px;padding:0 10px}
main{padding:10px 10px 70px;max-width:980px;margin:0 auto}
.kind{display:flex;gap:8px;margin-bottom:10px}.kind button{flex:1;border:1px solid #c5ccd6;background:#fff;border-radius:10px;padding:8px 10px;text-align:left;font-weight:800;font-size:15px}.kind button small{display:block;font-weight:500;font-size:11.5px;color:#667}.kind button.on{background:#10223a;border-color:#10223a;color:#fff}.kind button.on small{color:#cfd8e6}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;font-size:13px}.chips button{height:32px;border-radius:999px;border:1px solid #c5ccd6;background:#fff;padding:0 12px;font-size:13px}.chips button.on{background:#10223a;border-color:#10223a;color:#fff}.mu{color:#667;font-size:12.5px}
.dh{font-weight:800;font-size:15px;margin:14px 0 8px;padding-bottom:4px;border-bottom:2px solid #10223a}.dh small{font-weight:600;color:#667;font-size:12px;margin-left:4px}
.c{background:#fff;border:1px solid #d5dbe5;border-left:6px solid #10223a;border-radius:10px;padding:10px 12px;margin-bottom:10px}.c.tmp{border-left-color:#e08a00}.c.done{border-left-color:#2e9e5b}.c.warn{border-left-color:#c2410c}.c.cx{opacity:.55}
.r1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}.ty{font-size:11px;font-weight:800;color:#fff;background:#10223a;border-radius:4px;padding:1px 7px}.tmp .ty{background:#e08a00}.no{font-size:16px;font-weight:800}.bd{font-size:12px;font-weight:800;color:#fff;background:#10223a;border-radius:999px;padding:1px 9px}.bd.g{background:#2e9e5b}.bd.o{background:#c2410c}.qty{margin-left:auto;white-space:nowrap}.qty b{font-size:16px}
.r2{font-size:12.5px;color:#445;margin-top:3px}.r2 i{font-style:normal;color:#d92d20}
.pg i{display:inline-block;width:54px;height:6px;background:#e3e7ee;border-radius:3px;margin-right:5px;vertical-align:middle;overflow:hidden}.pg u{display:block;height:100%;background:#2e9e5b}
.row{display:grid;grid-template-columns:38px minmax(0,1fr);border-top:1px solid #edf0f4;margin-top:8px;padding-top:8px}.row>span{font-size:11px;font-weight:800;color:#778;padding-top:8px}
.fls{display:flex;flex-wrap:wrap;gap:6px}.fl{min-height:38px;border:1px solid #c5ccd6;background:#fff;border-radius:999px;padding:0 12px;font-size:13.5px}.fl.on{background:#2e9e5b;border-color:#2e9e5b;color:#fff;font-weight:700}.fl small{opacity:.9;font-size:11px}
.tl{background:#f0f5fc;border-radius:8px;padding:6px 9px;margin-bottom:6px;font-size:13px}.tl b{margin-right:4px}.tl.cx{opacity:.5;text-decoration:line-through}
.act{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:3px 8px;font-size:14px;margin-top:6px}.kv span{color:#667;font-size:12.5px;padding-top:1px}
.stp{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;margin-top:9px}.stp button{min-height:48px;border:1.5px solid #c5ccd6;border-radius:9px;background:#fff;text-align:left;padding:5px 9px;font-weight:800;font-size:14px}.stp small{display:block;font-weight:500;font-size:11.5px;color:#667}.stp .on{background:#2e9e5b;border-color:#2e9e5b;color:#fff}.stp .on small{color:#fff}
details{margin-top:8px}summary{font-weight:700;font-size:13.5px;padding:6px 0}.v{display:flex;gap:10px;align-items:flex-start;border-top:1px solid #eef0f4;padding:8px 0}.v input{width:24px;height:24px;flex:none;margin-top:2px}.v.on{opacity:.55}
.dvs{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.dvs span{background:#f0f5fc;border-radius:6px;padding:3px 9px;font-size:13px}
#dlg{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}#dlg>div{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:14px 14px 18px}
@media(min-width:700px){#dlg{align-items:center}#dlg>div{border-radius:14px}}
#dlg h3{margin:0 0 6px;font-size:17px}#dlg label{display:block;font-size:12.5px;color:#556;margin-top:9px}#dlg input[type=text],#dlg input[type=tel],#dlg input[type=datetime-local],#dlg input:not([type]){width:100%;height:42px;border:1px solid #c5ccd6;border-radius:8px;padding:0 10px;font-size:15px}
.er{color:#d92d20;font-size:13px;margin-top:6px;min-height:18px}.msg{text-align:center;padding:40px 16px;color:#556}
#busy{position:fixed;right:10px;bottom:10px;background:#10223a;color:#fff;border-radius:999px;padding:5px 12px;font-size:12px;z-index:9}
</style>
</head>
<body>
<header><div class="h1"><b>타이어케어 출고 관리</b><small>v1.1 · 2026-11-23</small><button id="whoB"></button></div>
<div class="tabs"><button data-tab="list">지시서 목록</button><button data-tab="out">출고 관리</button></div></header>
<div id="flt" hidden>거점 <select id="fc"></select><input type="date" id="ff"><span>~</span><input type="date" id="ft"><button class="b p" id="fg">조회</button><button class="b" id="fr">새로고침</button></div>
<main id="m"><div class="msg">여는 중…</div></main><div id="busy" hidden>최신 내용 확인 중…</div>
<script>
{
const GAS='https://script.google.com/macros/s/AKfycby33E3x2WOVkZd_Kh4LSumPMT-KKbNa292E9WNKKTdx40WjCxsVgpSTq2R7oJby6XDF/exec',PICK='pick.html',TRUCK='truck.html';
const TST=[['arrive','용차 도착'],['load','상차 완료'],['doc1','명세서 전달'],['doc2','회수운송장 전달'],['depart','출발'],['unload','하차지 도착'],['hand','인계 완료']];
const FL=[['print','지시서 출력'],['wo','출고 운송장 출력'],['wr','회수 운송장 출력']];
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const now=()=>{const d=new Date();return ymd(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())},dow=s=>'일월화수목금토'[new Date(s+'T00:00:00').getDay()];
const kc=(a,b)=>String(a).localeCompare(String(b),'ko');
const at=s=>{s=String(s||'');if(/^\d{4}-\d\d-\d\d/.test(s))return s.slice(5,16).replace('T',' ');const d=new Date(s);return isNaN(d)?s.slice(0,16):pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const dt=v=>v?String(v).replace('T',' ').slice(5,16).replace('-','/'):'-';
const SZ=/(\d{3}\/\d{2}Z?R\d{2})/,size=p=>{const m=String(p||'').match(SZ);return m?m[1]:String(p||'').split('_')[0]};
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem('wh_'+k)||'null');localStorage.setItem('wh_'+k,JSON.stringify(v))}catch(e){return null}};
let KEY=ls('key')||'',WHO=ls('who')||'',TAB=ls('tab')||'list',KIND='trk',TYPE='';
const T0=ymd(new Date()),F={from:addD(T0,-3),to:addD(T0,14),center:ls('center')||''};
let D={srv:[],trk:[]},LOADED=false,PEND=0,SEQ=0;
{const h=location.hash.slice(1);if(h){KEY=decodeURIComponent(h);ls('key',KEY);history.replaceState(null,'',location.pathname+location.search)}}
async function get(q){const j=await (await fetch(GAS+'?'+q+'&t='+encodeURIComponent(KEY))).json();if(!j.ok)throw new Error(j.err||'오류');return j}
async function post(b,safe){b.t=KEY;for(let n=0;;n++){let j;try{j=await (await fetch(GAS,{method:'POST',body:JSON.stringify(b)})).json()}catch(e){if(safe&&n<1){await new Promise(r=>setTimeout(r,1200));continue}throw new Error('통신 실패 — 저장되지 않았을 수 있습니다.')}if(j.busy&&safe&&n<1){await new Promise(r=>setTimeout(r,1500));continue}if(!j.ok)throw new Error(j.err||'오류');return j}}
function fkey(){return F.from+'|'+F.to}
function fetchAll(){const k=fkey();return Promise.all([get('a=list&from='+F.from+'&to='+F.to).then(r=>r.items),get('a=trk_list&from='+addD(F.from,-10)+'&to='+addD(F.to,10)).then(r=>r.items)]).then(([srv,trk])=>({k,srv:srv.filter(x=>x.M),trk}))}
async function load(quiet){const seq=++SEQ,key=fkey();if(!LOADED){const c=ls('cache');if(c&&c.k===key){D=c;LOADED=true;draw()}}
 if(!LOADED)$('#m').innerHTML='<div class="msg">불러오는 중…</div>';else if(!quiet)$('#busy').hidden=false;
 try{const n=await fetchAll();if(seq!==SEQ||key!==fkey())return;$('#busy').hidden=true;ls('cache',n);if(PEND||$('#dlg'))return;const same=LOADED&&JSON.stringify([D.srv,D.trk])===JSON.stringify([n.srv,n.trk]);D=n;LOADED=true;if(!same)draw()}
 catch(e){$('#busy').hidden=true;if(seq!==SEQ)return;if(!LOADED)$('#m').innerHTML='<div class="msg">불러오지 못했습니다.<br><small>'+esc(e.message)+'</small><br><br><button class="b" onclick="location.reload()">다시 시도</button>'+(/키가 맞지/.test(e.message)?'<br><br><button class="b" id="rk">링크(키) 다시 넣기</button>':'')+'</div>';const rk=$('#rk');if(rk)rk.onclick=()=>{ls('key','');location.reload()}}}
/* 저장: 화면을 먼저 바꾸고 뒤에서 저장. 실패하면 서버 내용으로 되돌린다. 같은 건은 누른 순서대로 처리 */
let Q=Promise.resolve();
function save(apply,body,safe,done){apply();draw();PEND++;Q=Q.then(()=>post(body,safe)).then(r=>{PEND--;if(done)done(r);if(!PEND)ls('cache',D)}).catch(e=>{PEND--;alert('저장하지 못했습니다 — 최신 내용으로 되돌립니다.\n'+e.message);LOADED=true;load()})}
function needWho(){if(WHO)return true;askWho();return false}
function askWho(){dlg(`<h3>이름</h3><div class="mu">체크·수정한 사람으로 기록됩니다. 로그인은 없습니다.</div><label>이름</label><input id="d_who" value="${esc(WHO)}" placeholder="예: 홍길동"><div class="er" id="d_e"></div><div class="act" style="justify-content:flex-end"><button class="b" data-x>닫기</button><button class="b p" id="d_ok">저장</button></div>`);
 $('#d_ok').onclick=()=>{const v=$('#d_who').value.trim();if(!v){$('#d_e').textContent='이름을 넣어 주세요.';return}WHO=v;ls('who',v);close();head()}}
function dlg(h){close();const d=document.createElement('div');d.id='dlg';d.innerHTML='<div>'+h+'</div>';document.body.appendChild(d);d.addEventListener('click',e=>{if(e.target===d||e.target.hasAttribute('data-x'))close()})}
function close(){const d=$('#dlg');if(d)d.remove()}
function head(){$('#whoB').textContent=WHO?WHO+' ▾':'이름 입력';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB))}
const inC=c=>!F.center||c===F.center,tot=M=>M.lines.reduce((s,g)=>s+g.w.length,0);
function trkOf(M){const w=new Set(M.lines.flatMap(g=>g.w));return D.trk.filter(t=>t.lines.some(g=>g.w.some(x=>w.has(x)))).map(t=>({t,n:t.lines.reduce((s,g)=>s+g.w.filter(x=>w.has(x)).length,0)}))}
function tstatus(x){const st=x.st||{},p=st.steps||{};if(st.cancel)return '취소';if(p.hand)return '인계완료';if(p.unload)return '하차지 도착';if(p.depart)return '운행중';if(p.load)return '상차완료';if(p.arrive)return '용차 도착';return x.plate?'배정':'용차 미배정'}
function flHtml(r,i){return FL.map(([k,l])=>{const f=(r.fl||{})[k];return `<button class="fl${f?' on':''}" data-a="fl" data-i="${i}" data-k="${k}">${f?'✓':'☐'} ${l}${f?` <small>${esc(at(f.at))} ${esc(f.by||'')}</small>`:''}</button>`}).join('')}
function sheetCard(r,i){const M=r.M,n=tot(M),cars=new Set(M.lines.map(g=>g.on)).size,T=trkOf(M),chk=r.checked||0,pc=n?Math.round(chk/n*100):0,done=(r.fl||{}).pick||(n&&chk>=n);
 return `<div class="c${M.tmp?' tmp':''}"><div class="r1"><span class="ty">${M.tmp?'임시':'정식'}</span><span class="no">${esc(M.no)}</span><span class="mu">${M.n}차</span>${done?'<span class="bd g">피킹 완료</span>':''}<span class="qty"><b>${cars}</b>대 · <b>${n}</b>본</span></div>
 <div class="r2">${esc(M.center)} · ${esc(M.drvLabel||'')} · 발행 ${esc(at(M.issued||r.at))} · 발행자 ${r.who?'<b>'+esc(r.who)+'</b>':'<i>기록 없음</i>'} · <span class="pg"><i><u style="width:${pc}%"></u></i>폰 체크 ${chk}/${n}</span></div>
 <div class="row"><span>출력</span><div class="fls">${flHtml(r,i)}</div></div>
 <div class="row"><span>용차</span><div>${T.map(({t,n:tn})=>`<div class="tl${t.st.cancel?' cx':''}"><b>${esc(t.id)}</b><span class="bd${t.plate?'':' o'}">${esc(t.status)}</span> ${esc(t.plate||'차량 미배정')} ${esc(t.driver)}<br>상차 <b>${dt(t.loadAt)}</b> → 하차 <b>${dt(t.unloadAt)}</b><br>하차지 <b>${esc(t.dest||'-')}</b><br>받는 기사 <b>${esc(t.recv||'-')}</b> · ${tn}/${n}본 <button class="b s" data-a="tedit" data-id="${esc(t.id)}">수정</button></div>`).join('')||'<span class="mu">등록 없음 (기사출고)</span>'}</div></div>
 <div class="act"><button class="b p" data-a="open" data-i="${i}">피킹지시서 열기</button><button class="b" data-a="treg" data-i="${i}">${T.length?'용차 추가·변경':'용차 등록'}</button></div></div>`}
function trkCard(x){const p=x.st.steps||{},ld=x.st.ld||{},V=new Map();x.lines.forEach(g=>{let a=V.get(g.on);if(!a)V.set(g.on,a={veh:g.veh,sup:g.sup,drv:g.drv,n:0,pn:[],z:[]});a.n+=g.w.length;const s=size(g.pn);if(a.pn.indexOf(s)<0)a.pn.push(s);if(a.z.indexOf(g.zone||'-')<0)a.z.push(g.zone||'-')});
 const lc=[...V.keys()].filter(k=>ld[k]).length,late=!x.st.cancel&&!p.load&&x.loadAt&&x.loadAt.replace('T',' ')<now();
 return `<div class="c${x.st.cancel?' cx':p.hand?' done':x.plate?'':' warn'}" data-id="${esc(x.id)}"><div class="r1"><span class="no">${esc(x.id)}</span><span class="bd${p.hand?' g':x.plate?'':' o'}">${esc(x.status)}</span>${late?'<span class="bd o">상차 예정 지남</span>':''}<span class="qty"><b>${x.cars}</b>대 · <b>${x.cnt}</b>본</span></div>
 <div class="kv"><span>용차</span><div><b>${esc(x.plate||'미배정')}</b> ${esc(x.driver||'')} ${x.phone?`<a href="tel:${esc(x.phone)}">${esc(x.phone)}</a>`:''}</div><span>상차 예정</span><b>${dt(x.loadAt)}</b><span>하차 예정</span><b>${dt(x.unloadAt)}</b><span>하차지</span><b>${esc(x.dest||'-')}</b><span>받는 기사</span><b>${esc(x.recv||'-')}</b>${x.memo?`<span>메모</span><div>${esc(x.memo)}</div>`:''}<span>출처</span><div class="mu">${esc(x.center)} · ${esc(x.src||'')} · 등록 ${esc(at(x.at))} ${esc(x.who||'')}${x.st.upd?` · 수정 ${esc(x.st.upd.at.slice(5))} ${esc(x.st.upd.by||'')}`:''}</div></div>
 <div class="stp">${TST.map(([k,l])=>`<button data-a="st" data-k="${k}" class="${p[k]?'on':''}">${l}<small>${p[k]?esc(dt(p[k].at))+' '+esc(p[k].by||''):'미체크'}</small></button>`).join('')}</div>
 <details${x._open?' open':''}><summary>싣는 물건 · 상차 확인 ${lc}/${V.size}대</summary>${[...V.entries()].map(([k,a])=>`<label class="v${ld[k]?' on':''}"><input type="checkbox" data-a="ld" data-k="${esc(k)}"${ld[k]?' checked':''}><div><b>${esc(a.veh)}</b> <span class="mu">${esc(a.sup)}</span><div>${esc(a.pn.join(', '))} · <b>${a.n}본</b> · 기사 ${esc(a.drv||'미배정')}</div><div class="mu">존 ${esc(a.z.join(', '))}</div></div></label>`).join('')}</details>
 <div class="act"><button class="b p" data-a="tedit" data-id="${esc(x.id)}">용차 정보 수정</button><button class="b" data-a="tcancel">${x.st.cancel?'취소 되돌리기':'용차 취소'}</button></div></div>`}
function drvOut(){const on=new Set();D.trk.filter(x=>!x.st.cancel).forEach(t=>t.lines.forEach(g=>g.w.forEach(w=>on.add(w))));
 return D.srv.map((r,i)=>{const M=r.M,P=new Map();let n=0,t=0;M.lines.forEach(g=>{t+=g.w.length;const c=g.w.filter(w=>!on.has(w)).length;if(!c)return;n+=c;const k=g.drv||'미배정';let a=P.get(k);if(!a)P.set(k,a={cars:new Set(),n:0});a.cars.add(g.on);a.n+=c});
  const fl=r.fl||{},chk=r.checked||0;return{r,i,M,P,n,tot:t,chk,fl,st:fl.pick||(t&&chk>=t)?2:chk>0?1:0}}).filter(d=>d.n&&inC(d.M.center))}
function drvCard(d){const M=d.M,pc=d.tot?Math.round(d.chk/d.tot*100):0,f=d.fl.pick;
 return `<div class="c${d.st===2?' done':d.st===0?' warn':''}"><div class="r1"><span class="ty"${M.tmp?' style="background:#e08a00"':''}>${M.tmp?'임시':'정식'}</span><span class="no">${esc(M.no)}</span><span class="bd${d.st===2?' g':d.st===0?' o':''}">${['피킹 전','피킹 중','피킹 완료 · 종결'][d.st]}</span><span class="qty">기사출고 <b>${d.n}</b>본</span></div>
 <div class="r2">${esc(M.center)} · 발행 ${esc(at(M.issued||d.r.at))} ${esc(d.r.who||'')}${d.tot>d.n?` · 용차 ${d.tot-d.n}본 별도`:''} · <span class="pg"><i><u style="width:${pc}%"></u></i>폰 체크 ${d.chk}/${d.tot}</span>${f?` · 완료 체크 ${esc(at(f.at))} ${esc(f.by||'')}`:''}</div>
 <div class="dvs">${[...d.P.entries()].sort((a,b)=>kc(a[0],b[0])).map(([k,a])=>`<span><b>${esc(k)}</b> ${a.cars.size}대 · ${a.n}본</span>`).join('')}</div>
 <div class="act"><button class="b${f?'':' p'}" data-a="dp" data-i="${d.i}">${f?'✓ 피킹 완료 (누르면 해제)':'피킹 완료 체크'}</button><button class="b" data-a="open" data-i="${d.i}">피킹지시서 열기</button></div>
 <div class="mu" style="margin-top:6px">${d.st===2?'피킹 완료 — 이후 출고는 기사가 기사 앱에서 처리합니다.':'피킹까지가 창고 업무입니다. 폰 체크가 모두 끝나면 자동으로 종결됩니다.'}</div></div>`}
function draw(){head();$('#flt').hidden=false;const cs=[...new Set(D.srv.map(r=>r.M.center).concat(D.trk.map(x=>x.center),F.center?[F.center]:[]).filter(Boolean))].sort(kc);
 $('#fc').innerHTML='<option value="">전체 거점</option>'+cs.map(c=>`<option${c===F.center?' selected':''}>${esc(c)}</option>`).join('');$('#ff').value=F.from;$('#ft').value=F.to;
 const sc=window.scrollY;let h='',pd='';
 if(TAB==='list'){const B=D.srv.map((r,i)=>({r,i})).filter(x=>inC(x.r.M.center)),inT=x=>!TYPE||(TYPE==='tmp')===!!x.r.M.tmp;
  h+=`<div class="chips">${[['','전체',B.length],['pk','정식',B.filter(x=>!x.r.M.tmp).length],['tmp','임시',B.filter(x=>x.r.M.tmp).length]].map(([k,l,c])=>`<button data-a="type" data-k="${k}" class="${TYPE===k?'on':''}">${l} <b>${c}</b></button>`).join('')}<span class="mu">미출력 <b>${B.filter(x=>!(x.r.fl||{}).print).length}</b> · 용차 없음 <b>${B.filter(x=>!trkOf(x.r.M).length).length}</b></span></div>`;
  const L=B.filter(inT).sort((a,b)=>kc(b.r.M.date,a.r.M.date)||kc(String(b.r.M.issued||''),String(a.r.M.issued||'')));

  if(!L.length)h+='<div class="msg">이 조건에 발행된 지시서가 없습니다.</div>'}
 else{const p=x=>x.st.steps||{},T=D.trk.filter(x=>inC(x.center)&&String(x.loadAt).slice(0,10)>=F.from&&String(x.loadAt).slice(0,10)<=F.to),DV=drvOut(),act=T.filter(x=>!x.st.cancel);
  h+=`<div class="kind"><button data-a="kind" data-k="trk" class="${KIND==='trk'?'on':''}">용차출고 <b>${act.filter(x=>!p(x).hand).length}</b><small>용차에 실어 보내는 건</small></button><button data-a="kind" data-k="drv" class="${KIND==='drv'?'on':''}">기사출고 <b>${DV.filter(d=>d.st<2).length}</b><small>기사가 직접 · 피킹까지</small></button></div>`;
  if(KIND==='trk'){h+=`<div class="chips"><span>용차 미배정 <b>${act.filter(x=>!x.plate).length}</b></span><span>상차 전 <b>${act.filter(x=>!p(x).load).length}</b></span><span>운행 중 <b>${act.filter(x=>p(x).depart&&!p(x).hand).length}</b></span><span class="mu">인계 완료 ${act.filter(x=>p(x).hand).length}</span></div>`;
   T.slice().sort((a,b)=>(a.st.cancel?1:0)-(b.st.cancel?1:0)||((p(a).hand?1:0)-(p(b).hand?1:0))||kc(a.loadAt,b.loadAt)).forEach(x=>{const d=x.st.cancel?'취소':p(x).hand?'인계 완료':'상차 '+x.loadAt.slice(0,10)+' ('+dow(x.loadAt.slice(0,10))+')';if(d!==pd){h+=`<div class="dh">${d}</div>`;pd=d}h+=trkCard(x)});
   if(!T.length)h+='<div class="msg">이 조건에 등록된 용차가 없습니다.<br><small>[지시서 목록]에서 지시서를 골라 [용차 등록]을 누르세요.</small></div>'}
  else{const n=k=>DV.filter(d=>d.st===k).length;h+=`<div class="chips"><span>피킹 전 <b>${n(0)}</b></span><span>피킹 중 <b>${n(1)}</b></span><span class="mu">종결 ${n(2)}</span></div>`;
   DV.slice().sort((a,b)=>(a.st===2?1:0)-(b.st===2?1:0)||kc(a.M.date,b.M.date)||kc(a.M.no,b.M.no)).forEach(d=>{const g=d.st===2?'피킹 완료 (종결)':'출고예정일 '+d.M.date+' ('+dow(d.M.date)+')';if(g!==pd){h+=`<div class="dh">${g}</div>`;pd=g}h+=drvCard(d)});
   if(!DV.length)h+='<div class="msg">이 조건에 기사출고 대상 지시서가 없습니다.</div>'}}
 $('#m').innerHTML=h;window.scrollTo(0,sc)}
function toObj(M){const L=M.lines,Dr=[...new Set(L.map(g=>g.drv))].sort(kc),P=[...new Set(L.map(g=>g.sup))];
 return{v:1,no:M.no,n:M.n,d:M.date,c:M.center,i:M.issued,w:M.who,u:M.due,t:M.tmp?1:0,f:M.drvLabel,D:Dr,P,L:L.map(g=>[g.zone,P.indexOf(g.sup),g.veh,g.model,g.pn,Dr.indexOf(g.drv),g.w,g.on,g.ri||0,g.sub?1:0,g.ot||'']),X:(M.ex||[]).map(x=>[x[0],x[1],x[3],x[4],x[6]])}}
async function openSheet(r){const lk=ls('lnk')||{};let k=lk[r.M.no];try{if(!k){$('#busy').hidden=false;$('#busy').textContent='지시서 여는 중…';k=(await post({a:'link',key:r.M.no,target:'전체',reuse:1,o:toObj(r.M)},true)).id;lk[r.M.no]=k;ls('lnk',lk)}location.href=PICK+'?k='+k}catch(e){alert('지시서를 열지 못했습니다.\n'+e.message)}finally{$('#busy').hidden=true;$('#busy').textContent='최신 내용 확인 중…'}}
const FIELDS=['loadAt','unloadAt','plate','driver','phone','dest','recv','memo'];
function trkForm(title,T,note,cars){const v=k=>esc(T[k]||'');
 dlg(`<h3>${title}</h3><div class="mu">${note||''}</div>
 <label>상차 예정</label><input type="datetime-local" id="f_loadAt" value="${v('loadAt')}"><label>하차(도착) 예정 — 상차일과 달라도 됩니다</label><input type="datetime-local" id="f_unloadAt" value="${v('unloadAt')}">
 <label>용차 차량번호 (배정 전이면 비워 두세요)</label><input id="f_plate" value="${v('plate')}"><label>용차 기사</label><input id="f_driver" value="${v('driver')}"><label>연락처</label><input type="tel" id="f_phone" value="${v('phone')}">
 <label>하차지</label><input id="f_dest" value="${v('dest')}"><label>받는 기사 (인수자)</label><input id="f_recv" value="${v('recv')}"><label>메모</label><input id="f_memo" value="${v('memo')}">
 ${cars?`<label>실을 차량 (${cars.length}대) — 빼려면 체크를 푸세요</label>${cars.map(c=>`<label class="v" style="margin:0"><input type="checkbox" data-car="${esc(c.on)}"${c.used?'':' checked'}><div><b>${esc(c.veh)}</b> <span class="mu">${esc(c.sup)}</span> · ${c.n}본 · 기사 ${esc(c.drv||'미배정')}${c.used?' <span class="mu">(이미 '+esc(c.used)+'에 있음 — 체크하면 옮김)</span>':''}</div></label>`).join('')}`:''}
 <div class="er" id="f_e"></div><div class="act" style="justify-content:flex-end"><button class="b" data-x>닫기</button><button class="b p" id="f_ok">저장</button></div>`);
 return new Promise(res=>{$('#f_ok').onclick=()=>{const o={};FIELDS.forEach(k=>o[k]=$('#f_'+k).value.trim());if(!o.loadAt){$('#f_e').textContent='상차 예정 일시를 넣어 주세요.';return}if(o.unloadAt&&o.unloadAt<o.loadAt){$('#f_e').textContent='하차 예정이 상차 예정보다 빠릅니다.';return}
  const sel=cars?[...document.querySelectorAll('[data-car]')].filter(c=>c.checked).map(c=>c.dataset.car):null;if(cars&&!sel.length){$('#f_e').textContent='실을 차량을 하나 이상 고르세요.';return}close();res({o,sel})}})}
function askMode(M,ex){return new Promise(res=>{const n=tot(M);dlg(`<h3>용차 배정 — ${esc(M.no)}</h3><div class="mu">이 지시서에는 이미 용차가 등록되어 있습니다. 무엇을 하시겠습니까?</div>
 ${ex.map(({t,n:c})=>`<div class="tl" style="margin-top:8px"><b>${esc(t.id)}</b><span class="bd${t.plate?'':' o'}">${esc(t.status)}</span> ${esc(t.plate||'차량 미배정')} ${esc(t.driver||'')}<br>상차 ${dt(t.loadAt)} → 하차 ${dt(t.unloadAt)}<br>하차지 ${esc(t.dest||'-')} · 받는 기사 ${esc(t.recv||'-')} · ${c}/${n}본</div>`).join('')}
 <div style="display:grid;gap:8px;margin-top:12px">${ex.map(({t},i)=>`<button class="b" style="height:auto;padding:9px 12px;text-align:left" data-m="edit" data-i="${i}">기존 용차 정보 변경 — ${esc(t.id)}<br><small class="mu">차량번호·기사·시각·하차지·받는 기사를 고칩니다</small></button>`).join('')}
 <button class="b p" style="height:auto;padding:9px 12px;text-align:left" data-m="add">용차 추가 배정<br><small>차량이 모자라 한 대 더 — 고른 차량은 기존 용차에서 옮겨집니다</small></button><button class="b" data-m="x">닫기</button></div>`);
 $('#dlg').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m;close();res(m==='x'?null:m==='edit'?{mode:'edit',t:ex[+b.dataset.i].t}:{mode:'add'})})})}
async function regTruck(r){if(!needWho())return;const M=r.M,ex=trkOf(M).filter(e=>!e.t.st.cancel);
 if(ex.length){const md=await askMode(M,ex);if(!md)return;if(md.mode==='edit'){editTruck(md.t);return}}
 const used=new Map();D.trk.filter(t=>!t.st.cancel).forEach(t=>t.lines.forEach(g=>used.set(g.on,t.id)));
 const C=new Map();M.lines.forEach(g=>{let a=C.get(g.on);if(!a)C.set(g.on,a={on:g.on,veh:g.veh,sup:g.sup,drv:g.drv,n:0,used:used.get(g.on)});a.n+=g.w.length});
 const drv=[...new Set(M.lines.map(g=>g.drv).filter(Boolean))];
 const x=await trkForm((ex.length?'용차 추가 배정 — ':'용차 등록 — ')+esc(M.no),{loadAt:M.date+'T08:00',recv:drv.join(', ')},`${esc(M.center)} · 출고예정일 ${M.date}. 체크한 차량 묶음이 용차 1건이 됩니다.${ex.length?' 이미 다른 용차에 있는 차량을 체크하면 새 용차로 옮겨집니다.':''}`,[...C.values()]);if(!x)return;
 const lines=M.lines.filter(g=>x.sel.indexOf(g.on)>=0).map(g=>({zone:g.zone,sup:g.sup,veh:g.veh,model:g.model,pn:g.pn,drv:g.drv,w:g.w,on:g.on,ot:g.ot||''})),T=Object.assign(x.o,{center:M.center,src:M.no,who:WHO,lines});
 try{$('#busy').hidden=false;const res=await post({a:'trk_add',T,move:1});alert('용차 '+res.id+' 을(를) 등록했습니다.'+(res.moved&&res.moved.length?'\n기존 용차 '+res.moved.join(', ')+' 에서 해당 차량을 옮겼습니다.':''));await load()}catch(e){alert('등록하지 못했습니다.\n'+e.message)}finally{$('#busy').hidden=true}}
async function editTruck(x){if(!needWho())return;const r=await trkForm('용차 정보 수정 — '+esc(x.id),x,'차량·시각·받는 기사는 배정 후에도 바꿀 수 있습니다. 바꾼 칸만 저장됩니다.');if(!r)return;const df={};FIELDS.forEach(f=>{if(String(r.o[f]||'')!==String(x[f]||''))df[f]=r.o[f]});if(!Object.keys(df).length)return;
 save(()=>{Object.assign(x,df);x.status=tstatus(x)},{a:'trk_set',id:x.id,info:df,rev:(x.st||{}).rev||0,by:WHO},false,res=>{const i=D.trk.findIndex(y=>y.id===x.id);if(i>=0){res.item._open=x._open;D.trk[i]=res.item}})}

 const a=t.dataset.a,r=t.dataset.i!==undefined?D.srv[+t.dataset.i]:null,card=t.closest('[data-id]'),x=card?D.trk.find(y=>y.id===card.dataset.id):null;

 if(a==='fl'&&r){if(!needWho())return;const k=t.dataset.k,on=!(r.fl||{})[k];save(()=>{r.fl=Object.assign({},r.fl||{});if(on)r.fl[k]={at:now(),by:WHO};else delete r.fl[k]},{a:'iss_set',no:r.M.no,key:k,on:on?1:0,by:WHO},true);return}
 if(a==='dp'&&r){if(!needWho())return;const on=!(r.fl||{}).pick;save(()=>{r.fl=Object.assign({},r.fl||{});if(on)r.fl.pick={at:now(),by:WHO};else delete r.fl.pick},{a:'iss_set',no:r.M.no,key:'pick',on:on?1:0,by:WHO},true);return}

  save(()=>{st.steps=st.steps||{};if(on)st.steps[k]={at:now(),by:WHO};else delete st.steps[k];x.status=tstatus(x)},{a:'trk_set',id:x.id,step:{name:k,on:on?1:0,at:now(),by:WHO}},true);return}
 if(a==='tcancel'&&x){if(!needWho())return;const on=!x.st.cancel;if(on&&!confirm(x.id+' 용차를 취소 처리할까요? (기록은 남습니다)'))return;save(()=>{if(on)x.st.cancel=now();else delete x.st.cancel;x.status=tstatus(x)},{a:'trk_set',id:x.id,cancel:on?1:0},true)}});

if(GAS.indexOf('%%')===0)$('#m').innerHTML='<div class="msg">공유 저장소 주소가 설정되지 않은 페이지입니다.</div>';
