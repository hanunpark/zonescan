<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>피킹지시서</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#eef1f5;color:#10223a;font:16px/1.45 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:5;background:#10223a;color:#fff;padding:10px 14px 8px}
.r1{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.dt{font-size:24px;font-weight:800;line-height:1.1}.dt small{font-size:13px;font-weight:600;opacity:.8;display:block;margin-bottom:2px}
.pc{text-align:right;font-weight:800;font-size:20px}.pc small{display:block;font-size:12px;font-weight:500;opacity:.8}
.sub{font-size:13px;opacity:.85;margin-top:4px}
.pb{height:7px;background:#ffffff33;border-radius:4px;margin-top:8px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:#ff7a1a;transition:width .2s}
nav{display:flex;gap:6px;margin-top:8px}nav button{flex:1;height:38px;border:0;border-radius:8px;background:#ffffff22;color:#fff;font:700 15px inherit}nav button.on{background:#fff;color:#10223a}
main{padding:10px 10px 40px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px}
.zh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}.zc{font-size:22px;font-weight:800}.cnt{font-weight:800}
.it{border-top:1px solid #eef0f4;padding:9px 0}.it:first-of-type{border-top:0}
.v{font-size:18px;font-weight:800}.mu{color:#667;font-size:13px}.p{font-size:14px;margin:2px 0 4px}
.chip{display:inline-block;color:#fff;border-radius:6px;padding:1px 8px;font-size:14px;font-weight:700;vertical-align:2px}
.wbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.wb{border:1.5px solid #c5ccd6;background:#fff;border-radius:8px;padding:6px 10px;font-size:15px;font-variant-numeric:tabular-nums;color:#10223a}
.wb.d{background:#2e9e5b;border-color:#2e9e5b;color:#fff}.wb.d:before{content:"✓ "}
.done{opacity:.5}.tag{display:inline-block;font-size:12px;font-weight:700;color:#2a6fb0;border:1px solid #2a6fb0;border-radius:4px;padding:0 4px;margin-left:4px}
.row{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #eef0f4;padding:8px 0}.row:first-of-type{border-top:0}
.ex{color:#b45309}.err{text-align:center;padding:40px 16px}
.ft{font-size:12px;color:#889;text-align:center;margin-top:14px}
button.l{border:1px solid #c5ccd6;background:#fff;border-radius:8px;height:40px;padding:0 14px;font:600 14px inherit;color:#10223a}
</style>
</head>
<body>
<div id="nav" hidden style="background:#0b1829;display:flex;gap:6px;padding:6px 10px"><a id="n1" style="flex:1;text-align:center;color:#fff;text-decoration:none;font-weight:700;font-size:14px;border:1px solid #ffffff55;border-radius:8px;padding:7px 4px">‹ 지시서 목록</a><a id="n2" style="flex:1;text-align:center;color:#fff;text-decoration:none;font-weight:700;font-size:14px;border:1px solid #ffffff55;border-radius:8px;padding:7px 4px">출고 관리</a></div><header id="hd" hidden><div class="r1"><div class="dt"><small id="no"></small><span id="dt"></span></div><div class="pc"><span id="pc"></span><small>꺼낸 수 / 전체</small></div></div>
<div class="sub" id="sb"></div><div class="pb"><i id="pbi"></i></div>
<nav><button data-v="z" class="on">존 순서로 꺼내기</button><button data-v="d">기사별로 모으기</button></nav></header>
<main id="m"><div class="err">지시서를 여는 중…</div></main>
<script>
{
const GAS='https://script.google.com/macros/s/AKfycby33E3x2WOVkZd_Kh4LSumPMT-KKbNa292E9WNKKTdx40WjCxsVgpSTq2R7oJby6XDF/exec';
const PAL=['#e4572e','#2a6fb0','#2e9e5b','#8e44ad','#d4a017','#0f8b8d','#c2185b','#5d4037','#455a64','#ef6c00'];
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const zc=(a,b)=>(a||'￿').localeCompare(b||'￿','ko',{numeric:true}),kc=(a,b)=>String(a).localeCompare(String(b),'ko');
const dow=s=>'일월화수목금토'[new Date(s+'T00:00:00').getDay()];
let O,K,done={},view='z',LK='',KEY='',TK=null;
function cxBanner(c){let b=document.getElementById('cxb');if(!c){if(b)b.remove();return}if(!b){b=document.createElement('div');b.id='cxb';b.style.cssText='position:sticky;top:0;z-index:20;background:#c2410c;color:#fff;font-weight:800;padding:10px 12px;font-size:15px';document.body.insertBefore(b,document.body.firstChild)}b.textContent='⛔ 취소된 지시서입니다 — 피킹하지 마세요 ('+(c.why||'사유 없음')+' · '+(c.by||'')+' '+String(c.at||'').slice(5)+')'}
const dtS=v=>v?String(v).replace('T',' ').slice(5,16).replace('-','/'):'-';
function tkTag(on){if(!TK||!TK.m[on])return '';const i=TK.L.findIndex(t=>t.id===TK.m[on]);return `<span class="tag" style="background:#10223a;color:#fff;border-color:#10223a">용차${TK.L.length>1?i+1:''}</span>`}
function shipHtml(L){if(!TK)return '';const C=new Map();L.forEach(g=>{let a=C.get(g.on);if(!a)C.set(g.on,a={n:0,t:TK.m[g.on]});a.n+=g.w.length});const tc=[...C.values()].filter(a=>a.t),dc=[...C.values()].filter(a=>!a.t),sum=a=>a.reduce((s,x)=>s+x.n,0);
 return `<div class="card" style="border:2px solid #10223a"><b>출고 방식</b> ${tc.length?`<span class="tag" style="background:#10223a;color:#fff;border-color:#10223a">용차출고 ${tc.length}대 · ${sum(tc)}본</span>`:''}${dc.length?`<span class="tag">기사출고 ${dc.length}대 · ${sum(dc)}본</span>`:''}<div class="mu">${tc.length?(dc.length?'「용차」 표시 차량만 용차에 싣고, 나머지는 기사가 직접 출고':'전부 용차에 실어 보냄'):'용차 없음 — 피킹 후 기사가 직접 출고'}</div>${TK.L.filter(t=>L.some(g=>TK.m[g.on]===t.id)).map(t=>{const i=TK.L.indexOf(t);return `<div style="border-top:1px dashed #99a;margin-top:6px;padding-top:6px;font-size:14px"><b>용차${TK.L.length>1?i+1:''}</b> ${esc(t.id)} <span class="tag">${esc(t.status)}</span><br><b>${esc(t.plate||'차량 미배정')}</b> ${esc(t.driver||'')} ${t.phone?`<a href="tel:${esc(t.phone)}">${esc(t.phone)}</a>`:''}<br>상차 <b>${dtS(t.loadAt)}</b> → 하차 <b>${dtS(t.unloadAt)}</b><br>하차지 <b>${esc(t.dest||'-')}</b><br>받는 기사 <b>${esc(t.recv||'-')}</b></div>`}).join('')}</div>`}
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
async function dec(h){const z=h[0],b=atob(h.slice(1).replace(/-/g,'+').replace(/_/g,'/')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
 let out=u;if(z==='1'){if(!window.DecompressionStream)throw new Error('이 브라우저는 지원하지 않습니다. 크롬으로 열어 주세요.');out=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
 return JSON.parse(new TextDecoder().decode(out))}
const col=i=>PAL[i%PAL.length],chip=i=>`<span class="chip" style="background:${col(i)}">${esc(O.D[i]||'미배정')}</span>`;
function lines(){return O.L.map(a=>({zone:a[0],sup:O.P[a[1]],veh:a[2],model:a[3],pn:a[4],di:a[5],w:a[6],on:a[7],ri:a[8],sub:a[9],ot:a[10]}))}
function prog(){const L=lines(),t=L.reduce((s,g)=>s+g.w.length,0),d=L.reduce((s,g)=>s+g.w.filter(w=>done[w]).length,0);$('#pc').textContent=d+' / '+t;$('#pbi').style.width=(t?d/t*100:0)+'%'}
function render(){const L=lines();let h='';const SH=shipHtml(L);
 if(view==='z'){const Z=new Map();L.forEach(g=>{const z=g.zone||'';if(!Z.has(z))Z.set(z,[]);Z.get(z).push(g)});
  h=[...Z.keys()].sort(zc).map(z=>{const a=Z.get(z),t=a.reduce((s,g)=>s+g.w.length,0),d=a.reduce((s,g)=>s+g.w.filter(w=>done[w]).length,0);
   return `<div class="card${d===t?' done':''}"><div class="zh"><span class="zc">${esc(z||'(존 미지정)')}</span><span class="cnt">${d}/${t}${d===t?' ✓':''}</span></div>${a.map(g=>`<div class="it"><div><span class="v">${esc(g.veh)}</span> ${tkTag(g.on)}${chip(g.di)}${g.sub?'<span class="tag">서브 Y</span>':''}</div><div class="p">${esc(g.pn)} · <b>${g.w.length}본</b>${g.ri?'<span class="tag">접수확정</span>':''}${g.ot?'<span class="tag" style="background:#c2410c;color:#fff;border-color:#c2410c">'+esc(/^(출고건|미입고|취소요청)/.test(g.ot)?g.ot:'출고건·'+g.ot)+'</span>':''}</div><div class="mu">${esc(g.sup)}${g.model?' · '+esc(g.model):''}</div><div class="wbs">${g.w.map(w=>`<button class="wb${done[w]?' d':''}" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div></div>`).join('')}</div>`}).join('')}
 else{h=O.D.map((n,i)=>{const a=L.filter(g=>g.di===i).sort((x,y)=>kc(x.veh,y.veh)||zc(x.zone,y.zone)),t=a.reduce((s,g)=>s+g.w.length,0),d=a.reduce((s,g)=>s+g.w.filter(w=>done[w]).length,0),cars=new Set(a.map(g=>g.on)).size;
   return `<div class="card"><div class="zh"><span>${chip(i)} <b>${cars}대 · ${t}본</b></span><span class="cnt">${d}/${t}${d===t&&t?' ✓':''}</span></div>${a.map(g=>{const k=g.w.filter(w=>done[w]).length;return `<div class="row"><div><span class="v" style="font-size:16px">${esc(g.veh)}</span>${tkTag(g.on)}${g.sub?'<span class="tag">서브 Y</span>':''} <span class="mu">${esc(g.sup)}</span><div class="p">${esc(g.pn)}</div><div class="mu">존 ${esc(g.zone||'-')}</div></div><b style="white-space:nowrap;color:${k===g.w.length?'#2e9e5b':'#10223a'}">${k}/${g.w.length}</b></div>`}).join('')}</div>`}).join('')}
 if(O.X&&O.X.length)h+=`<div class="card ex"><b>꺼낼 수 없는 건 (참고)</b>${O.X.map(x=>`<div class="row"><span>${esc(x[0])} · ${esc(x[2])} · ${esc(x[1])}</span><b>${x[4]}본</b></div>`).join('')}</div>`;
 h+=`<div class="ft">${esc(O.no)} · ${O.t?'임시':O.n+'차'} · 발행 ${esc(O.i)}${O.w?' · '+esc(O.w):''}<br>발행 시점 기준 화면입니다. 이후 루티 변경은 반영되지 않습니다. (출고 방식·용차 정보는 열 때마다 최신으로 받습니다)${LK?'<br>체크는 같은 지시서를 받은 사람끼리 공유됩니다.':''}<br>${LK?'<button class="l" id="rf" style="margin-top:8px">다른 사람 체크 불러오기</button> ':''}<button class="l" id="rs" style="margin-top:8px">체크 모두 지우기</button></div>`;
 $('#m').innerHTML=SH+h;prog()}
document.addEventListener('click',e=>{const t=e.target;
 if(t.dataset.w){const w=t.dataset.w;if(done[w])delete done[w];else done[w]=1;LS(K,done);push(w,done[w]?1:0);t.classList.toggle('d',!!done[w]);prog();if(navigator.vibrate)navigator.vibrate(20);
  const c=t.closest('.card');if(c&&view==='z'){const b=[...c.querySelectorAll('[data-w]')],d=b.filter(x=>done[x.dataset.w]).length;c.querySelector('.cnt').textContent=d+'/'+b.length+(d===b.length?' ✓':'');c.classList.toggle('done',d===b.length)}return}
 if(t.dataset.v){view=t.dataset.v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===t));render();scrollTo(0,0);return}
 if(t.id==='rs'&&confirm('이 지시서의 체크를 모두 지울까요?')){Object.keys(done).forEach(w=>push(w,0));done={};LS(K,done);render()}
 if(t.id==='rf'){pull().then(render)}});
const Q=[];let busy=false;
function push(w,v){if(!LK)return;Q.push({a:'check',id:LK,key:KEY,wb:w,v});flush()}
async function flush(){if(busy||!Q.length)return;busy=true;const x=Q[0];try{const r=await fetch(GAS,{method:'POST',body:JSON.stringify(x)});const j=await r.json();if(j.ok)Q.shift();else throw 0}catch(e){busy=false;setTimeout(flush,4000);return}busy=false;flush()}
async function pull(){if(!LK)return;try{const j=await (await fetch(GAS+'?a=get&k='+encodeURIComponent(LK))).json();if(j.ok){if(j.tk!==undefined)TK=j.tk;cxBanner(j.cancel);const s={};(j.checked||[]).forEach(w=>s[w]=1);Q.forEach(q=>{if(q.v)s[q.wb]=1;else delete s[q.wb]});done=s;LS(K,done)}}catch(e){}}
(async()=>{try{const k=new URLSearchParams(location.search).get('k'),h=location.hash.slice(1);
 if(k){if(GAS.indexOf('%%')===0)throw new Error('공유 저장소 주소가 설정되지 않은 페이지입니다.');const j=await (await fetch(GAS+'?a=get&k='+encodeURIComponent(k))).json();if(!j.ok)throw new Error(j.err||'지시서를 찾지 못했습니다');
  O=j.o;LK=k;KEY=j.key;TK=j.tk||null;setTimeout(()=>cxBanner(j.cancel),0);K='pk_'+O.no+'_'+O.n+'_'+O.f;done={};(j.checked||[]).forEach(w=>done[w]=1);LS(K,done)}
 else if(h){O=await dec(h);K='pk_'+O.no+'_'+O.n+'_'+O.f;done=LS(K)||{}}
 else throw new Error('지시서 링크가 아닙니다. PC의 [전달하기]로 받은 링크를 열어 주세요.');document.title=O.d.slice(5)+' 피킹 · '+O.f;
 $('#no').textContent=(O.t?'[임시] ':'')+O.no+(O.t?'':' · '+O.n+'차')+' · 출고예정일';$('#dt').textContent=O.d+' ('+dow(O.d)+')';
 try{if(localStorage.getItem('wh_key')){$('#nav').hidden=false;$('#n1').href='wh.html?tab=list&no='+encodeURIComponent(O.no);$('#n2').href='wh.html?tab=out&no='+encodeURIComponent(O.no)}}catch(_){}
 const L=lines();$('#sb').textContent=O.c+' · '+O.f+' · 차량 '+new Set(L.map(g=>g.on)).size+'대'+(O.u?' · 마감 '+O.u:'');$('#hd').hidden=false;render()}
 catch(e){$('#m').innerHTML='<div class="err">지시서를 열 수 없습니다.<br><small>'+esc(e.message)+'</small></div>'}})();
}
</script>
</body>
</html>
