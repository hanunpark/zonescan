<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f5f6f9;color:#1b1d33;font:16px/1.45 -apple-system,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:5;background:#1b1d33;color:#fff;padding:10px 14px 8px}

.done{opacity:.5}.tag{display:inline-block;font-size:12px;font-weight:700;color:#4b5fe0;border:1px solid #4b5fe0;border-radius:4px;padding:0 4px;margin-left:4px}

.ex{color:#8a5a00}.err{text-align:center;padding:40px 16px}

body{background:#f2f4f6;color:#191f28;font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
#nav{background:#fff!important;padding:10px 12px 0!important;gap:0!important;justify-content:space-between}#nav a{flex:none!important;border:0!important;color:#4e5968!important;font-weight:600!important;font-size:15px!important;padding:6px 8px!important}

header small,.sub{opacity:1!important;color:#8b95a1}
main{padding:12px 16px 60px}
.card{border-radius:20px;padding:18px;margin-bottom:12px;border:0!important}
h3{font-size:15px;color:#4e5968;margin:0 0 12px}
.mu{color:#8b95a1}
button.l{border:0;background:#f2f4f6;border-radius:12px;height:44px;padding:0 16px;font-weight:600;font-size:14.5px;color:#191f28}

.nt h4{font-size:18px;margin:8px 0 4px}.nt .bdy{color:#4e5968}.nt .ok{color:#0a7d3c;font-weight:700}.nt button{margin-top:12px;width:100%}
.mm{border-top:1px solid #f2f4f6!important;padding:10px 0!important}.rl{font-size:11px!important;font-weight:700!important;border-radius:5px!important;padding:1px 6px!important}
.r1{align-items:flex-end}.dt{font-size:26px;font-weight:800;letter-spacing:-.02em}.dt small{font-size:13px;font-weight:600;color:#8b95a1;margin-bottom:4px}
.pc{font-size:24px;font-weight:800}.pc small{color:#8b95a1;font-size:12px;font-weight:500}
.sub{font-size:13.5px;margin-top:6px}
.pb{height:6px;background:#f2f4f6;margin-top:12px}.pb i{background:#4b5fe0}
nav{background:#f2f4f6;border-radius:12px;padding:3px;gap:0;margin-top:12px}nav button{height:38px;background:transparent;color:#8b95a1;border-radius:10px;font-size:14.5px}nav button.on{background:#fff;color:#191f28;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.zh{margin-bottom:8px}.zc{font-size:24px;letter-spacing:-.02em}.cnt{font-size:16px;color:#4e5968}
.it{border-top:1px solid #f2f4f6;padding:14px 0}.v{font-size:19px}.p{font-size:14.5px;color:#4e5968;margin:4px 0}
.chip{border-radius:6px;font-size:13.5px;padding:1px 8px}
.tag{border:0;background:#eef0ff;border-radius:6px;padding:1px 6px;font-weight:600}
.wbs{gap:8px;margin-top:10px}.wb{border:0;background:#f2f4f6;border-radius:10px;padding:9px 12px;font-size:15px;font-weight:600}.wb.d{background:#0a7d3c;color:#fff}
.wb.kp{border:2px solid #000;background:#fff;padding:5px 7px}.wb.kp.d{background:#0a7d3c;border-color:#0a7d3c}
.row{border-top:1px solid #f2f4f6;padding:10px 0}
.ex{color:#9a6200}.ft{color:#8b95a1;font-size:12.5px;line-height:1.6}

</style>

<body>
<div id="nav" hidden style="background:#0b1829;display:flex;gap:6px;padding:6px 10px"><a id="n1" style="flex:1;text-align:center;color:#fff;text-decoration:none;font-weight:700;font-size:14px;border:1px solid #ffffff55;border-radius:8px;padding:7px 4px">‹ 지시서 목록</a><a id="n2" style="flex:1;text-align:center;color:#fff;text-decoration:none;font-weight:700;font-size:14px;border:1px solid #ffffff55;border-radius:8px;padding:7px 4px">출고 관리</a></div><header id="hd" hidden><div class="r1"><div class="dt"><small id="no"></small><span id="dt"></span></div><div class="pc"><span id="pc"></span><small>꺼낸 수 / 전체</small></div></div>
<div class="sub" id="sb"></div><div class="pb"><i id="pbi"></i></div>
<nav><button data-v="z" class="on">존 순서로 꺼내기</button><button data-v="d">기사별로 모으기</button></nav></header>
<main id="m"><div class="err">지시서를 여는 중…</div></main>
<script>
{
const GAS='%%GAS%%';
const PAL=['#e4572e','#4b5fe0','#0a7d3c','#8e44ad','#d4a017','#0f8b8d','#c2185b','#5d4037','#455a64','#ef6c00'];
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const zc=(a,b)=>(a||'￿').localeCompare(b||'￿','ko',{numeric:true}),kc=(a,b)=>String(a).localeCompare(String(b),'ko');
const dow=s=>'일월화수목금토'[new Date(s+'T00:00:00').getDay()];
const VK=g=>String(g.veh||'').replace(/\s/g,'')||String(g.on||'');
let O,K,done={},view='z',LK='',KEY='',TK=null,TITLE='',NT=[],MM=[];
const ME=()=>{try{return localStorage.getItem('pk_who')||''}catch(e){return ''}};
function topHtml(){const me=ME();let h='';NT.forEach(n=>{const ok=me&&n.acks.some(a=>a.r==='wk'&&a.n===me),c=n.lvl==='긴급'?' r':n.lvl==='중요'?' o':'';h+=`<div class="card nt${c}"><span class="lv">${esc(n.lvl)} 공지</span><h4>${esc(n.title)}</h4>${n.body?`<div class="bdy">${esc(n.body)}</div>`:''}<div class="mu">${esc(n.by)} · ${esc(String(n.at).slice(5,16))}</div>${ok?'<div class="ok">✓ 확인함 ('+esc(me)+')</div>':`<button class="l" data-nk="${esc(n.no)}">확인했습니다</button>`}</div>`});
 if(MM.length)h+=`<div class="card mmc"><h3>작업 메모</h3>${MM.map(m=>`<div class="mm"><span class="tag">${m.r==='pc'?'지시자':'창고'}</span> ${esc(m.text)}<div class="mu">${esc(m.by)} · ${esc(String(m.upd||m.at).slice(5,16))}</div></div>`).join('')}</div>`;return h}
function cxBanner(c){let b=document.getElementById('cxb');if(!c){if(b)b.remove();return}if(!b){b=document.createElement('div');b.id='cxb';b.style.cssText='position:sticky;top:0;z-index:20;background:#c0302f;color:#fff;font-weight:800;padding:10px 12px;font-size:15px';document.body.insertBefore(b,document.body.firstChild)}b.textContent='⛔ 취소된 지시서입니다 — 피킹하지 마세요 ('+(c.why||'사유 없음')+' · '+(c.by||'')+' '+String(c.at||'').slice(5)+')'}
const dtS=v=>v?String(v).replace('T',' ').slice(5,16).replace('-','/'):'-';
function tkTag(on){if(!TK||!TK.m[on])return '';const i=TK.L.findIndex(t=>t.id===TK.m[on]);return `<span class="tag" style="background:#1b1d33;color:#fff;border-color:#1b1d33">용차${TK.L.length>1?i+1:''}</span>`}
function shipHtml(L){if(!TK)return '';const C=new Map();L.forEach(g=>{const k=VK(g)+'|'+(TK.m[g.on]||'');let a=C.get(k);if(!a)C.set(k,a={n:0,t:TK.m[g.on]});a.n+=g.w.length});const tc=[...C.values()].filter(a=>a.t),dc=[...C.values()].filter(a=>!a.t),sum=a=>a.reduce((s,x)=>s+x.n,0);
 return `<div class="card ship"><b>출고 방식</b> ${tc.length?`<span class="tag" style="background:#1b1d33;color:#fff;border-color:#1b1d33">용차출고 ${tc.length}대 · ${sum(tc)}본</span>`:''}${dc.length?`<span class="tag">기사출고 ${dc.length}대 · ${sum(dc)}본</span>`:''}<div class="mu">${tc.length?(dc.length?'「용차」 표시 차량만 용차에 싣고, 나머지는 기사가 직접 출고':'전부 용차에 실어 보냄'):'용차 없음 — 피킹 후 기사가 직접 출고'}</div>${TK.L.filter(t=>L.some(g=>TK.m[g.on]===t.id)).map(t=>{const i=TK.L.indexOf(t);return `<div class="ln"><b>용차${TK.L.length>1?i+1:''}</b> ${esc(t.id)} <span class="tag">${esc(t.status)}</span><br><b>${esc(t.plate||'차량 미배정')}</b> ${esc(t.driver||'')} ${t.phone?`<a href="tel:${esc(t.phone)}">${esc(t.phone)}</a>`:''}<br>상차 <b>${dtS(t.loadAt)}</b> → 하차 <b>${dtS(t.unloadAt)}</b><br>하차지 <b>${esc(t.dest||'-')}</b><br>받는 기사 <b>${esc(t.recv||'-')}</b></div>`}).join('')}</div>`}
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
async function dec(h){const z=h[0],b=atob(h.slice(1).replace(/-/g,'+').replace(/_/g,'/')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
 let out=u;if(z==='1'){if(!window.DecompressionStream)throw new Error('이 브라우저는 지원하지 않습니다. 크롬으로 열어 주세요.');out=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
 return JSON.parse(new TextDecoder().decode(out))}
const col=i=>PAL[i%PAL.length],chip=i=>`<span class="chip" style="background:${col(i)}">${esc(O.D[i]||'미배정')}</span>`;
function lines(){return O.L.map(a=>({zone:a[0],sup:O.P[a[1]],veh:a[2],model:a[3],pn:a[4],di:a[5],w:a[6],on:a[7],ri:a[8],sub:a[9],ot:a[10],kp:a[11]||0,xw:a[12]||{}}))}
/* 보관품 재출고: 운송장번호(외부)로 표기, 검은 바탕 흰 글자 */
const kpp=(g,w)=>{const x=String((g.xw&&g.xw[w])||w),d=x.replace(/\D/g,''),h=x.indexOf('-')>0?x.slice(0,x.indexOf('-')):d.slice(0,4);return{h:'*'+h+'~',t:d.slice(-4)}};
const wtx=(g,w)=>{if(!g.kp)return esc(w);const p=kpp(g,w);return `<span class="kv"><i>${esc(p.h)}</i><b>${esc(p.t)}</b></span>`};
function prog(){const L=lines(),t=L.reduce((s,g)=>s+g.w.length,0),d=L.reduce((s,g)=>s+g.w.filter(w=>done[w]).length,0);$('#pc').textContent=d+' / '+t;$('#pbi').style.width=(t?d/t*100:0)+'%'}
function render(){const L=lines();let h='';const SH=shipHtml(L);
 if(view==='z'){const Z=new Map();L.forEach(g=>{const z=g.zone||'';if(!Z.has(z))Z.set(z,[]);Z.get(z).push(g)});
  h=[...Z.keys()].sort(zc).map(z=>{const a=Z.get(z),t=a.reduce((s,g)=>s+g.w.length,0),d=a.reduce((s,g)=>s+g.w.filter(w=>done[w]).length,0);
   return `<div class="card${d===t?' done':''}"><div class="zh"><span class="zc">${esc(z||'(존 미지정)')}</span><span class="cnt">${d}/${t}${d===t?' ✓':''}</span></div>${a.map(g=>`<div class="it"><div><span class="v">${esc(g.veh)}</span> ${tkTag(g.on)}${chip(g.di)}${g.sub?'<span class="tag">서브 Y</span>':''}</div><div class="p">${esc(g.pn)} · <b>${g.w.length}본</b>${g.ri?'<span class="tag">접수확정</span>':''}${g.ot?'<span class="tag" style="background:#c0302f;color:#fff;border-color:#c0302f">'+esc(/^(출고건|미입고|취소요청)/.test(g.ot)?g.ot:'출고건·'+g.ot)+'</span>':''}${g.kp?' <span class="kpt">보관품 재출고</span>':''}</div><div class="mu">${esc(g.sup)}${g.model?' · '+esc(g.model):''}</div><div class="wbs">${g.w.map(w=>`<button class="wb${g.kp?' kp':''}${done[w]?' d':''}" data-w="${esc(w)}">${wtx(g,w)}</button>`).join('')}</div></div>`).join('')}</div>`}).join('')}
 else{h=O.D.map((n,i)=>{const a=L.filter(g=>g.di===i).sort((x,y)=>kc(x.veh,y.veh)||zc(x.zone,y.zone)),t=a.reduce((s,g)=>s+g.w.length,0),d=a.reduce((s,g)=>s+g.w.filter(w=>done[w]).length,0),cars=new Set(a.map(VK)).size;
   return `<div class="card"><div class="zh"><span>${chip(i)} <b>${cars}대 · ${t}본</b></span><span class="cnt">${d}/${t}${d===t&&t?' ✓':''}</span></div>${a.map(g=>{const k=g.w.filter(w=>done[w]).length;return `<div class="row"><div><span class="v" style="font-size:16px">${esc(g.veh)}</span>${tkTag(g.on)}${g.sub?'<span class="tag">서브 Y</span>':''} <span class="mu">${esc(g.sup)}</span><div class="p">${esc(g.pn)}</div><div class="mu">존 ${esc(g.zone||'-')}</div></div><b style="white-space:nowrap;color:${k===g.w.length?'#0a7d3c':'#1b1d33'}">${k}/${g.w.length}</b></div>`}).join('')}</div>`}).join('')}
 if(O.X&&O.X.length)h+=`<div class="card ex"><b>꺼낼 수 없는 건 (참고)</b>${O.X.map(x=>`<div class="row"><span>${esc(x[0])} · ${esc(x[2])} · ${esc(x[1])}</span><b>${x[4]}본</b></div>`).join('')}</div>`;
 h+=`<div class="ft">${esc(O.no)} · ${O.t?'임시':O.n+'차'} · 발행 ${esc(O.i)}${O.w?' · '+esc(O.w):''}<br>발행 시점 기준 화면입니다. 이후 루티 변경은 반영되지 않습니다. (출고 방식·용차 정보는 열 때마다 최신으로 받습니다)${LK?'<br>체크는 같은 지시서를 받은 사람끼리 공유됩니다.':''}<br>${LK?'<button class="l" id="rf" style="margin-top:8px">다른 사람 체크 불러오기</button> ':''}<button class="l" id="rs" style="margin-top:8px">체크 모두 지우기</button></div>`;
 $('#m').innerHTML=topHtml()+SH+h;prog()}
document.addEventListener('click',e=>{const t=(e.target.closest&&e.target.closest('[data-w]'))||e.target;
 if(t.dataset.w){const w=t.dataset.w;if(done[w])delete done[w];else done[w]=1;LS(K,done);push(w,done[w]?1:0);t.classList.toggle('d',!!done[w]);prog();if(navigator.vibrate)navigator.vibrate(20);
  const c=t.closest('.card');if(c&&view==='z'){const b=[...c.querySelectorAll('[data-w]')],d=b.filter(x=>done[x.dataset.w]).length;c.querySelector('.cnt').textContent=d+'/'+b.length+(d===b.length?' ✓':'');c.classList.toggle('done',d===b.length)}return}
 if(t.dataset&&t.dataset.nk){let me=ME();if(!me){me=(prompt('확인한 사람 이름을 넣어 주세요. (이 폰에서 한 번만 묻습니다)')||'').trim();if(!me)return;try{localStorage.setItem('pk_who',me)}catch(_){}}const no=t.dataset.nk,n=NT.find(z=>z.no===no);t.disabled=true;t.textContent='저장 중…';
